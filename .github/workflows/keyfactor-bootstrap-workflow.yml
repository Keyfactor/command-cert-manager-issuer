name: Keyfactor Bootstrap Workflow

on:
  workflow_dispatch:
  pull_request:
    types: [opened, closed, synchronize, edited, reopened]
  push:
    # Dependabot branches are already covered by the pull_request event.
    branches-ignore:
      - 'dependabot/**'
  create:
    branches:
      - 'release-*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  call-starter-workflow:
    # Dependabot PRs are reviewed manually and don't receive repository secrets.
    # Build, test and lint still run on them via test.yml.
    if: github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]'
    uses: keyfactor/actions/.github/workflows/starter.yml@3.2.0
    secrets:
      token: ${{ secrets.V2BUILDTOKEN}}
      gpg_key: ${{ secrets.KF_GPG_PRIVATE_KEY }}
      gpg_pass: ${{ secrets.KF_GPG_PASSPHRASE }}
      APPROVE_README_PUSH: ${{ secrets.APPROVE_README_PUSH}}
      scan_token: ${{ secrets.SAST_TOKEN }}
      docker-user: ${{ secrets.DOCKER_USER }}
      docker-token:  ${{ secrets.DOCKER_PWD }}

