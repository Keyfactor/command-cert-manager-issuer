version: 2
updates:
  - package-ecosystem: 'gomod'
    # Raise pull requests for version updates
    # against the `main` branch
    target-branch: "main"
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      # These modules must move together, so update them in a single PR.
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
          - "github.com/cert-manager/cert-manager"
      # Major bumps are intentionally left out so they get their own PR.
      gomod-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: 'github-actions'
    # Raise pull requests for version updates
    # against the `main` branch
    target-branch: "main"
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
