# Opt-in RBAC for Issuer/ClusterIssuer resources that use spec.serviceAccountRef.
#
# This is deliberately NOT part of config/rbac/kustomization.yaml and is not generated from kubebuilder
# markers. [create] on serviceaccounts/token lets the controller authenticate as any ServiceAccount in the
# scope it is granted for, so it is granted per namespace, only where the feature is used. Apply one copy per
# tenant namespace, replacing TENANT_NAMESPACE (e.g. `sed s/TENANT_NAMESPACE/tenant-a/ ... | kubectl apply -f -`).
#
# The subject below is the controller ServiceAccount created by config/default
# (name prefix "command-issuer-", namespace "command-issuer-system"); adjust it if you changed either.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: command-issuer-serviceaccount-token-role
  namespace: TENANT_NAMESPACE
rules:
  # Read provider annotations on the referenced ServiceAccount. Not needed if every Issuer sets
  # explicit, complete identity values on serviceAccountRef.
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - get
  # Request a short-lived token for the referenced ServiceAccount.
  - apiGroups:
      - ""
    resources:
      - serviceaccounts/token
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: command-issuer-serviceaccount-token-rolebinding
  namespace: TENANT_NAMESPACE
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: command-issuer-serviceaccount-token-role
subjects:
  - kind: ServiceAccount
    name: command-issuer-controller-manager
    namespace: command-issuer-system
