{{- if .Values.crd.create -}}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  {{- with .Values.crd.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: clusterissuers.command-issuer.keyfactor.com
spec:
  group: command-issuer.keyfactor.com
  names:
    kind: ClusterIssuer
    listKind: ClusterIssuerList
    plural: clusterissuers
    singular: clusterissuer
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ClusterIssuer is the Schema for the clusterissuers API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: IssuerSpec defines the desired state of Issuer
            properties:
              apiPath:
                default: KeyfactorAPI
                description: APIPath is the base path of the Command API. KeyfactorAPI
                  by default
                type: string
              caBundleConfigMapName:
                description: |-
                  The name of the ConfigMap containing the CA bundle to use when verifying
                  Command's server certificate. If specified, the CA bundle will be added to
                  the client trust roots for the Command issuer. If both caSecretName and caBundleConfigMapName
                  are specified, caBundleConfigMapName will take precedence.
                type: string
              caBundleKey:
                description: |-
                  The key in the Secret or ConfigMap containing the CA certificate bundle.
                  Applies to both caSecretName and caBundleConfigMapName.
                  If unspecified, the last key alphabetically in the Secret or ConfigMap data will be used.
                type: string
              caSecretName:
                description: |-
                  The name of the secret containing the CA bundle to use when verifying
                  Command's server certificate. If specified, the CA bundle will be added to
                  the client trust roots for the Command issuer. If both caSecretName and caBundleConfigMapName
                  are specified, caBundleConfigMapName will take precedence.
                type: string
              certificateAuthorityHostname:
                description: |-
                  CertificateAuthorityHostname is the hostname associated with the Certificate Authority specified by
                  CertificateAuthorityLogicalName E.g. "ca.example.com"
                type: string
              certificateAuthorityLogicalName:
                description: |-
                  CertificateAuthorityLogicalName is the logical name of the certificate authority to use. Not required if an enrollment pattern is specified,
                  except if the enrollment pattern targets a standalone CA. If empty, an eligible certificate authority within the enrollment pattern's configuration tenant
                  will be used.
                  E.g. "Keyfactor Root CA" or "Intermediate CA"
                type: string
              enrollmentPatternId:
                description: |-
                  EnrollmentPatternId is the ID of the enrollment pattern to use. Supported in Keyfactor Command 25.1 and later.
                  If both enrollment pattern and certificate template are specified, enrollment pattern will take precedence.
                  If both enrollmentPatternId and enrollmentPatternName are specified, enrollmentPatternId will take precedence.
                  Enrollment will fail if the specified template is not compatible with the enrollment pattern.
                  Refer to the Keyfactor Command documentation for more information.
                type: integer
                format: int32
              enrollmentPatternName:
                description: |-
                  EnrollmentPatternName is the name of the enrollment pattern to use. Supported in Keyfactor Command 25.1 and later.
                  If both enrollment pattern and certificate template are specified, enrollment pattern will take precedence.
                  If both enrollmentPatternId and enrollmentPatternName are specified, enrollmentPatternId will take precedence.
                  Enrollment will fail if the specified template is not compatible with the enrollment pattern.
                  Refer to the Keyfactor Command documentation for more information.
                type: string
              healthcheck:
                description: |-
                  The healthcheck configuration for the issuer. This configures the frequency at which the issuer will perform
                  a health check to determine issuer's connectivity to Command instance.
                properties:
                  enabled:
                    description: 'Determines whether to enable the health check when the
                      issuer is healthy. Default: true'
                    type: boolean
                  interval:
                    description: The interval at which to health check the issuer
                      when healthy. Defaults to 10 minutes.
                    type: string
                required:
                - enabled
                type: object
              ownerRoleId:
                description: |-
                  OwnerRoleId is the ID of the security role assigned as the certificate owner.
                  The specified security role must be assigned to the authorized identity context.
                  If OwnerRoleId and OwnerRoleName are both specified, OwnerRoleId will take precedence.
                  This field is required if the enrollment pattern, certificate template, or system-wide settings has been configured as Required.
                type: integer
                format: int32
              ownerRoleName:
                description: |-
                  OwnerRoleName is the name of the security role assigned as the certificate owner. This name must match the existing name of the security role.
                  The specified security role must be assigned to the authorized identity context.
                  If OwnerRoleId and OwnerRoleName are both specified, OwnerRoleId will take precedence.
                  This field is required if the enrollment pattern, certificate template, or system-wide settings has been configured as Required.
                type: string
              certificateTemplate:
                description: |-
                  CertificateTemplate is the name of the certificate template to use. Deprecated in favor of EnrollmentPattern as of Keyfactor Command 25.1.
                  If both enrollment pattern and certificate template are specified, enrollment pattern will take precedence.
                  Enrollment will fail if the specified template is not compatible with the enrollment pattern.
                  Refer to the Keyfactor Command documentation for more information.
                type: string
              commandSecretName:
                description: |-
                  A reference to a K8s kubernetes.io/basic-auth Secret containing basic auth
                  credentials for the Command instance configured in Hostname. The secret must
                  be in the same namespace as the referent. If the
                  referent is a ClusterIssuer, the reference instead refers to the resource
                  with the given name in the configured 'cluster resource namespace', which
                  is set as a flag on the controller component (and defaults to the
                  namespace that the controller runs in).
                  If this is set, serviceAccountRef must not be set.
                type: string
              hostname:
                description: Hostname is the hostname of a Keyfactor Command instance.
                type: string
              scopes:
                description: |-
                  A list of comma separated scopes used when requesting a Bearer token from an ambient token provider implied
                  by the environment, rather than by commandSecretName. For example, could be set to
                  api://{tenant ID}/.default when requesting an access token for Entra ID (DefaultAzureCredential). Has no
                  effect on OAuth 2.0 Client Credential configuration - please specify the scopes for this method in an Opaque secret.
                type: string
              audience:
                description: |-
                  The audience value used when requesting a Bearer token from an ambient token provider implied
                  by the environment, rather than by commandSecretName. For example, could be set to
                  https://example.com when requesting an access token from Google's identity token provider. Ideally, this should be
                  the URL of your Command environment. Has no effect on OAuth 2.0 Client Credential configuration - please specify 
                  the audience for this method in an Opaque secret.
                type: string
              serviceAccountRef:
                description: |-
                  ServiceAccountRef, if set, causes ambient credential resolution to use
                  the Workload Identity bound to the referenced Kubernetes ServiceAccount instead
                  of the operator's own ServiceAccount. If this is set, commandSecretName must not be set.
                properties:
                  azure:
                    description: |-
                      Azure holds explicit Azure identity values that override the
                      ServiceAccount's annotations. Only valid when the provider is Azure.
                    properties:
                      clientId:
                        description: |-
                          ClientID is the client (application) ID of the Entra ID identity to
                          authenticate as. Overrides the azure.workload.identity/client-id annotation.
                        type: string
                      tenantId:
                        description: |-
                          TenantID is the Entra ID tenant, as a GUID or domain name. Overrides the
                          azure.workload.identity/tenant-id annotation; falls back to the
                          controller-level default flag if unset here and not annotated on the
                          ServiceAccount.
                        type: string
                    type: object
                  gcp:
                    description: |-
                      GCP holds explicit GCP identity values that override the ServiceAccount's
                      annotations. Only valid when the provider is GCP.
                    properties:
                      serviceAccountEmail:
                        description: |-
                          ServiceAccountEmail is the GCP service account to impersonate. Overrides
                          the iam.gke.io/gcp-service-account annotation.
                          Exact field set to be finalized with the GCP WIF validation.
                        type: string
                    type: object
                  name:
                    description: Name is the name of the Kubernetes ServiceAccount.
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace is required for ClusterIssuer (cluster-scoped, no implicit namespace).
                      For a namespaced Issuer it must be omitted or equal to the Issuer's own
                      namespace.
                    type: string
                  provider:
                    description: |-
                      Provider explicitly selects the cloud provider, overriding annotation inference
                      on the ServiceAccount. Optional.
                    enum:
                    - azure
                    - gcp
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: only one of azure or gcp may be set
                  rule: '!(has(self.azure) && has(self.gcp))'
                - message: azure may only be set when provider is azure or unset
                  rule: '!has(self.azure) || !has(self.provider) || self.provider
                    == ''azure'''
                - message: gcp may only be set when provider is gcp or unset
                  rule: '!has(self.gcp) || !has(self.provider) || self.provider ==
                    ''gcp'''
            type: object
          status:
            description: IssuerStatus defines the observed state of Issuer
            properties:
              conditions:
                description: |-
                  List of status conditions to indicate the status of a CertificateRequest.
                  Known condition types are `Ready`.
                items:
                  description: IssuerCondition contains condition information for
                    an Issuer.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the timestamp corresponding to the last status
                        change of this condition.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        Message is a human readable description of the details of the last
                        transition, complementing reason.
                      type: string
                    reason:
                      description: |-
                        Reason is a brief machine readable explanation for the condition's last
                        transition.
                      type: string
                    status:
                      description: Status of the condition, one of ('True', 'False',
                        'Unknown').
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: Type of the condition, known values are ('Ready').
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
