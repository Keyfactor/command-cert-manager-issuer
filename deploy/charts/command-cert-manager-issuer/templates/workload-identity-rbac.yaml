{{- /*
Grants the controller access to the ServiceAccounts referenced by Issuer/ClusterIssuer resources
through `serviceAccountRef`: [get] on serviceaccounts (annotation inference) and [create] on
serviceaccounts/token (TokenRequest). Nothing is granted unless a namespace is listed or the
cluster-wide option is enabled, because [create] on serviceaccounts/token lets the controller
authenticate as any ServiceAccount in the scope it is granted for.
*/ -}}
{{- if .Values.workloadIdentity.useClusterRoleForServiceAccountAccess }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "command-cert-manager-issuer.labels" . | nindent 4 }}
  name: {{ include "command-cert-manager-issuer.name" . }}-serviceaccount-token-role
rules:
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - serviceaccounts/token
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    {{- include "command-cert-manager-issuer.labels" . | nindent 4 }}
  name: {{ include "command-cert-manager-issuer.name" . }}-serviceaccount-token-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "command-cert-manager-issuer.name" . }}-serviceaccount-token-role
subjects:
  - kind: ServiceAccount
    name: {{ include "command-cert-manager-issuer.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- else }}
{{- range .Values.workloadIdentity.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    {{- include "command-cert-manager-issuer.labels" $ | nindent 4 }}
  name: {{ include "command-cert-manager-issuer.name" $ }}-serviceaccount-token-role
  namespace: {{ . }}
rules:
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - serviceaccounts/token
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    {{- include "command-cert-manager-issuer.labels" $ | nindent 4 }}
  name: {{ include "command-cert-manager-issuer.name" $ }}-serviceaccount-token-rolebinding
  namespace: {{ . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "command-cert-manager-issuer.name" $ }}-serviceaccount-token-role
subjects:
  - kind: ServiceAccount
    name: {{ include "command-cert-manager-issuer.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
