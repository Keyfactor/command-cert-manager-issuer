# Default values for command-cert-manager-issuer chart.

# The number of replica command-cert-manager-issuers to run
replicaCount: 1

image:
  repository: "keyfactor/command-cert-manager-issuer"
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart version.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

secretConfig:
  # If true, when using Issuer resources, the credential secret must be created in the same namespace as the
  # Issuer resource. This access is facilitated by granting the ServiceAccount [get, list, watch] for the secret
  # API at the cluster level.
  #
  # If false, both Issuer and ClusterIssuer must reference a secret in the same namespace as the chart/reconciler.
  # This access is facilitated by granting the ServiceAccount [get, list, watch] for the secret API only for the
  # namespace the chart is deployed in.
  useClusterRoleForSecretAccess: false

  # If true, when using Issuer resources, the configmap resource must be created in the same namespace as the
  # Issuer resource. This access is facilitated by granting the ServiceAccount [get, list, watch] for the config map
  # API at the cluster level.
  #
  # If false, both Issuer and ClusterIssuer must reference a config map in the same namespace as the chart/reconciler.
  # This access is facilitated by granting the ServiceAccount [get, list, watch] for the config map API only for the
  # namespace the chart is deployed in.
  useClusterRoleForConfigMapAccess: false

workloadIdentity:
  # Namespaces whose ServiceAccounts may be referenced by Issuer/ClusterIssuer resources through
  # `serviceAccountRef`. For each namespace listed, the controller's ServiceAccount is granted [get] on the
  # serviceaccounts API (to read provider annotations) and [create] on the serviceaccounts/token API (to request
  # a short-lived token for the referenced ServiceAccount) with a Role and RoleBinding in that namespace only.
  #
  # Granting [create] on serviceaccounts/token allows the controller to authenticate as any ServiceAccount in the
  # namespaces it is granted for, so list only the namespaces that use this feature and keep the ServiceAccounts
  # in them minimally privileged.
  #
  # Empty by default: nothing is granted, and `serviceAccountRef` cannot be used.
  namespaces: []

  # If true, the permissions above are granted with a ClusterRole and ClusterRoleBinding instead, so a
  # `serviceAccountRef` may reference a ServiceAccount in any namespace. This allows the controller to authenticate
  # as ANY ServiceAccount in the cluster, which undermines tenant isolation. Not recommended on shared clusters.
  # When true, `namespaces` is ignored.
  useClusterRoleForServiceAccountAccess: false

  # The Azure tenant ID used for a `serviceAccountRef` when neither the Issuer (`azure.tenantId`) nor the referenced
  # ServiceAccount (`azure.workload.identity/tenant-id` annotation) sets one. Optional.
  defaultAzureTenantID: ""

crd:
  # Specifies whether CRDs will be created
  create: true
  # Annotations to add to the CRD
  annotations: {}

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Labels to add to the service account
  labels: {}
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  # Specifies whether to automount the service account token
  # If false, a projected volume will be used to mount the token
  automountServiceAccountToken: false
  # Configuration for projected service account token volume (used when automountServiceAccountToken is false)
  projectedTokenVolume:
    # Token expiration time in seconds
    expirationSeconds: 3607
    # File permissions for the token
    defaultMode: 0444

podLabels: {}

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

priorityClassName: ""

defaultHealthCheckInterval: ""

env: {}
  # This can be used to set an http proxy to access the Keyfactor instance
  # - name: https_proxy
  #   value: http://someproxy:someport
  # - name: no_proxy
  #   value: .somedomain.com,.local,10.0.0.1
